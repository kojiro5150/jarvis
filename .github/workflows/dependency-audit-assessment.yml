name: Dependency audit safe fix

on:
  push:
    branches:
      - repo-health-npm-audit

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repo-health-npm-audit
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply non-major audit fixes to lockfile only
        run: npm audit fix --package-lock-only --ignore-scripts || true
      - name: Commit safe lockfile remediation
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "security: apply non-major dependency audit fixes"
          git push origin HEAD:repo-health-npm-audit
