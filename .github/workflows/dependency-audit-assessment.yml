name: Dependency audit assessment

on:
  push:
    branches:
      - repo-health-npm-audit

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply non-major audit fixes to lockfile only
        run: npm audit fix --package-lock-only --ignore-scripts || true
      - name: Generate post-fix audit report
        run: npm audit --json > npm-audit-after.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: npm-audit-safe-fix
          path: |
            package-lock.json
            npm-audit-after.json
