name: Open PR from patch

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch name to create (e.g. codex/composite-head)"
        required: true
      title:
        description: "PR title"
        required: true
      body:
        description: "PR description (optional, paste Codex's summary here)"
        required: false
        default: ""
      patch_b64:
        description: "Base64-encoded git patch (output of: git diff > change.patch && base64 -w0 change.patch)"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create branch
        run: git switch -c "${{ inputs.branch }}"

      - name: Apply patch
        run: |
          echo "${{ inputs.patch_b64 }}" | base64 -d > change.patch
          git apply --index change.patch

      - name: Regenerate lockfile if package.json changed
        run: |
          if git diff --cached --name-only | grep -qx "package.json"; then
            npm install --package-lock-only
            git add package-lock.json
          fi

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "${{ inputs.title }}"

      - name: Push
        run: git push origin "${{ inputs.branch }}"

      - name: Open PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --title "${{ inputs.title }}" \
            --body "${{ inputs.body }}" \
            --base main \
            --head "${{ inputs.branch }}"
