name: Regenerate lockfile for tooling modernization

on:
  push:
    branches:
      - repo-health-eslint-actions-modernization

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: repo-health-eslint-actions-modernization
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: regenerate lockfile for ESLint 9"
          git push origin HEAD:repo-health-eslint-actions-modernization
